[project]
name = "coach-brain"
version = "0.1.0"
description = "Asistente coach conversacional con RAG sobre material del coach"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ilan Daniele" }]
dependencies = [
    # LLM API
    "anthropic>=0.40",
    # PDFs
    "pypdf>=5.1",
    "pymupdf>=1.25",
    # Audio/Video transcription (GPU via CTranslate2)
    "faster-whisper>=1.1",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9.0,<10",
    # Vector store + embeddings
    "qdrant-client>=1.13",
    "sentence-transformers>=3.3",
    "FlagEmbedding>=1.3",
    # UI
    "streamlit>=1.40",
    # Utilities
    "python-dotenv>=1.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "typer>=0.15",
    "rich>=13.9",
    "tqdm>=4.67",
    "pillow>=11.0",
    "gdown>=5.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
]

[project.scripts]
coach = "coach_brain.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coach_brain"]

# --- PyTorch CUDA wheels ---
# RTX 5070 Ti Laptop (Blackwell, sm_120) requiere PyTorch compilado para CUDA 13.0+.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Los scripts imprimen tablas de informe alineadas con formatos de ancho fijo
# (`%-44s`, `%6d`, `%8.1f`). Reescribirlos a f-strings a ciegas desalinea las
# columnas sin que falle nada, asi que UP031 no aplica ahi.
"scripts/*" = ["UP031"]
# upload_to_qdrant_cloud.py mete src/ en sys.path antes de importar coach_brain,
# para poder correrse con un Python que no tenga el paquete instalado. Eso obliga
# a que sus imports queden despues de una sentencia, que es justo lo que E402
# marca. Es deliberado, no un descuido: moverlos arriba rompe el script fuera del
# venv del proyecto.
"scripts/upload_to_qdrant_cloud.py" = ["E402"]

[tool.coverage.run]
source = ["src/coach_brain"]
branch = true

[tool.coverage.report]
show_missing = true
# El 100% es el piso, no una meta: el repo ya esta ahi, con ramas incluidas.
# Si algo lo baja, es porque entro codigo sin test, y eso se ve aca antes de
# que lo tape el resto del informe. CI no mide cobertura (pytest-cov no esta
# instalado), asi que este numero lo sostiene la corrida local:
#   python -m coverage run -m pytest -q && python -m coverage report
fail_under = 100
exclude_also = [
    # El `if __name__ == "__main__":` de cada modulo es una linea de arranque
    # que llama a `main()`, no logica. La forma de "cubrirla" seria correr el
    # modulo como script en un subproceso, que no prueba nada que los tests de
    # `main()` no prueben ya, o monkeypatchear `__name__`, que es teatro.
    # Declararlas fuera de alcance deja el porcentaje diciendo la verdad: lo
    # que falta de verdad, falta.
    'if __name__ == "__main__":',
]
