[project]
name = "coach-brain"
version = "0.1.0"
description = "Asistente coach conversacional con RAG sobre material del coach"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ilan Daniele" }]
dependencies = [
    # LLM API
    "anthropic>=0.40",
    # PDFs
    "pypdf>=5.1",
    "pymupdf>=1.25",
    # Audio/Video transcription (GPU via CTranslate2)
    "faster-whisper>=1.1",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9.0,<10",
    # Vector store + embeddings
    "qdrant-client>=1.13",
    "sentence-transformers>=3.3",
    "FlagEmbedding>=1.3",
    # UI
    "streamlit>=1.40",
    # Utilities
    "python-dotenv>=1.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "typer>=0.15",
    "rich>=13.9",
    "tqdm>=4.67",
    "pillow>=11.0",
    "gdown>=5.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
]

[project.scripts]
coach = "coach_brain.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coach_brain"]

# --- PyTorch CUDA wheels ---
# RTX 5070 Ti Laptop (Blackwell, sm_120) requiere PyTorch compilado para CUDA 13.0+.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
