# fly.toml app configuration file generated for coach-brain-ilan on 2026-06-15T15:11:28-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'coach-brain-ilan'
primary_region = 'iad'

[build]

[env]
  COACH_RESPONSE_BACKEND = 'anthropic'
  DATA_DIR = '/data'
  EMBED_DEVICE = 'cpu'
  OLLAMA_ENABLED = 'false'
  PROMPTS_DIR = '/app/prompts'
  QDRANT_PATH = '/app/qdrant_storage'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8501
  force_https = true
  # Siempre prendida: cargar bge-m3 (2.2GB) desde cero tarda ~3 min, y con la
  # maquina apagandose por inactividad se pagaba ese arranque en cada vuelta.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '15s'
    grace_period = '3m0s'
    method = 'GET'
    path = '/_stcore/health'

[[vm]]
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 4096
